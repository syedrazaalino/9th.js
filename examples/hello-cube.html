<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9th.js — Hello Cube</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: system-ui, sans-serif; }
    #info { position: absolute; top: 12px; left: 12px; color: #e8eaed; background: rgba(0,0,0,.45); padding: 10px 14px; border-radius: 6px; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="info">
    <strong>9th.js Hello Cube</strong><br />
    Rotating MeshBasicMaterial cube · v1.0.4
  </div>
  <canvas id="canvas"></canvas>

  <script type="module">
    import {
      WebGLRenderer,
      Scene,
      PerspectiveCamera,
      BoxGeometry,
      MeshBasicMaterial,
      Mesh,
      AmbientLight,
      DirectionalLight,
      VERSION
    } from '../dist/esm/main.js';

    const canvas = document.getElementById('canvas');
    const renderer = new WebGLRenderer({ canvas, antialias: true });
    renderer.setClearColor({ r: 0.04, g: 0.05, b: 0.07 }, 1);

    const scene = new Scene();
    const camera = new PerspectiveCamera(60, 1, 0.1, 100);
    camera.position.set(0, 1.5, 4);
    camera.lookAt(0, 0, 0);

    scene.add(new AmbientLight(0xffffff, 0.35));
    const sun = new DirectionalLight(0xffffff, 1);
    sun.position.set(3, 5, 2);
    scene.add(sun);

    const cube = new Mesh(
      new BoxGeometry(1.2, 1.2, 1.2),
      new MeshBasicMaterial({ color: '#4fc3f7' })
    );
    scene.add(cube);

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    console.log('9th.js', VERSION);

    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.y += 0.012;
      cube.rotation.x += 0.007;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9th.js — Examples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c1014;
      --bg-elev: #141a21;
      --ink: #e8edf2;
      --muted: #8b98a8;
      --accent: #3db8a8;
      --line: rgba(232, 237, 242, 0.08);
      --glow: rgba(61, 184, 168, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, var(--glow), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(90, 140, 200, 0.12), transparent 50%),
        var(--bg);
    }
    .wrap { width: min(1120px, calc(100% - 2.5rem)); margin: 0 auto; padding: 3.5rem 0 5rem; }
    header { display: grid; gap: 0.85rem; margin-bottom: 2.75rem; max-width: 40rem; }
    .brand { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
    h1 {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.6rem, 6vw, 4rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }
    h1 em { font-style: italic; color: #b7c4d0; }
    .lede { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.55; max-width: 34rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.5rem; }
    .actions a {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.65rem 1rem; border-radius: 999px; text-decoration: none;
      font-size: 0.92rem; font-weight: 500; border: 1px solid var(--line);
      color: var(--ink); background: rgba(255,255,255,0.03);
      transition: border-color .2s, background .2s, transform .2s;
    }
    .actions a:hover { border-color: rgba(61, 184, 168, 0.45); background: rgba(61, 184, 168, 0.08); transform: translateY(-1px); }
    .actions a.primary { background: var(--accent); color: #06231f; border-color: transparent; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.25rem; }
    .card {
      display: grid; grid-template-rows: auto 1fr;
      background: var(--bg-elev); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(61, 184, 168, 0.35); box-shadow: 0 18px 40px rgba(0,0,0,.35); }
    .preview {
      position: relative; aspect-ratio: 16 / 10; background: #07090c;
      border-bottom: 1px solid var(--line); overflow: hidden;
    }
    .preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview .open {
      position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end;
      padding: 0.75rem; text-decoration: none;
      background: linear-gradient(to top, rgba(0,0,0,.5), transparent 45%);
      opacity: 0; transition: opacity .2s;
    }
    .card:hover .preview .open { opacity: 1; }
    .preview .open span {
      font-size: 0.78rem; font-weight: 500; color: #06231f; background: var(--accent);
      padding: 0.4rem 0.7rem; border-radius: 999px;
    }
    .meta { padding: 1.1rem 1.2rem 1.25rem; display: grid; gap: 0.35rem; }
    .meta h2 { margin: 0; font-size: 1.1rem; font-weight: 700; }
    .meta p { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.45rem; }
    .tags span {
      font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; color: #9fb0c0;
      border: 1px solid var(--line); padding: 0.22rem 0.45rem; border-radius: 999px;
    }
    footer { margin-top: 3rem; color: var(--muted); font-size: 0.88rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">9th.js examples</div>
      <h1>See what it can <em>render</em></h1>
      <p class="lede">
        Real WebGL captures from the verified demos — scene graph, lit materials, primitives, lights, orbit controls, and GLTF.
      </p>
      <div class="actions">
        <a class="primary" href="https://www.npmjs.com/package/9th.js">npm install 9th.js</a>
        <a href="https://github.com/syedrazaalino/9th.js">GitHub</a>
      </div>
    </header>
    <section class="grid" id="gallery"></section>
    <footer>
      Run <code>npm run build && npx serve .</code> then open a demo for the live WebGL version.
      Built with <a href="https://digitalcloud.no">digitalcloud</a>.
    </footer>
  </div>
  <script>
    const demos = [
      { title: 'Hello cube', file: 'hello-cube.html', img: '../media/previews/hello-cube.png', blurb: 'Unlit MeshBasicMaterial cube spinning in a scene.', tags: ['Mesh', 'BoxGeometry', 'MeshBasicMaterial'] },
      { title: 'Lit cube + orbit', file: 'lit-cube.html', img: '../media/previews/lit-cube.png', blurb: 'PBR cube with ambient + directional light and OrbitControls.', tags: ['MeshStandardMaterial', 'Lights', 'OrbitControls'] },
      { title: 'Primitives', file: 'primitives.html', img: '../media/previews/primitives.png', blurb: 'Box, sphere, cylinder, cone, and a ground plane.', tags: ['Geometry', 'Scene'] },
      { title: 'Materials', file: 'materials.html', img: '../media/previews/materials.png', blurb: 'Metalness / roughness row under studio lighting.', tags: ['PBR', 'Spheres'] },
      { title: 'Lights', file: 'lights.html', img: '../media/previews/lights.png', blurb: 'Colored point lights on a metal orb.', tags: ['PointLight', 'DirectionalLight'] },
      { title: 'GLTF triangle', file: 'gltf-triangle.html', img: '../media/previews/gltf-triangle.png', blurb: 'GLTFLoader parsing an embedded mesh into the scene graph.', tags: ['GLTFLoader', 'Materials'] }
    ];
    document.getElementById('gallery').innerHTML = demos.map((d) => `
      <article class="card">
        <div class="preview">
          <img src="${d.img}" alt="${d.title}" loading="lazy" />
          <a class="open" href="${d.file}"><span>Open live demo</span></a>
        </div>
        <div class="meta">
          <h2>${d.title}</h2>
          <p>${d.blurb}</p>
          <div class="tags">${d.tags.map((t) => `<span>${t}</span>`).join('')}</div>
        </div>
      </article>
    `).join('');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9th.js — Lit Cube + OrbitControls</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: system-ui, sans-serif; }
    #info { position: absolute; top: 12px; left: 12px; color: #e8eaed; background: rgba(0,0,0,.45); padding: 10px 14px; border-radius: 6px; max-width: 280px; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <div id="info">
    <strong>9th.js Lit Cube</strong><br />
    MeshStandardMaterial + lights<br />
    Drag to orbit · scroll to zoom · v1.0.3
  </div>
  <canvas id="canvas"></canvas>

  <script type="module">
    import {
      WebGLRenderer,
      Scene,
      PerspectiveCamera,
      BoxGeometry,
      MeshStandardMaterial,
      Mesh,
      AmbientLight,
      DirectionalLight,
      OrbitControls,
      VERSION
    } from '../dist/esm/main.js';

    const canvas = document.getElementById('canvas');
    const renderer = new WebGLRenderer({ canvas, antialias: true });
    renderer.setClearColor({ r: 0.04, g: 0.05, b: 0.07 }, 1);
    // Avoid flaky frustum paths while iterating demos
    renderer.enableFrustumCulling = false;

    const scene = new Scene();
    const camera = new PerspectiveCamera(60, 1, 0.1, 100);
    camera.position.set(2.5, 2, 4);
    camera.lookAt(0, 0, 0);

    scene.add(new AmbientLight(0xffffff, 0.35));
    const sun = new DirectionalLight(0xffffff, 1.2);
    sun.position.set(3, 5, 2);
    scene.add(sun);

    const cube = new Mesh(
      new BoxGeometry(1.2, 1.2, 1.2),
      new MeshStandardMaterial({ color: '#4fc3f7', metalness: 0.25, roughness: 0.35 })
    );
    scene.add(cube);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = false;
    controls.target = { x: 0, y: 0, z: 0 };
    controls.needsUpdate = true;
    controls.update();

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    console.log('9th.js', VERSION, 'lights', scene.getLights().length);

    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.y += 0.008;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
